# DOCCAR.PRO — приложение (Next.js: сайт + админка + API).
#
# Своего Caddy нет: сервер общий с lenkrad.ru, порты 80/443 и TLS держит
# контейнер lenkrad-caddy (проект /opt/lenkrad). Блок doccar.pro прописан в его
# Caddyfile и проксирует на doccar-app:3000 по общей docker-сети lenkrad_web.
# Не размещать на IP VPN-ноды (веб-порты режутся).
#
# ВАЖНО: имя сервиса — «doccar», НЕ «app». Имя сервиса становится DNS-алиасом в
# общей сети lenkrad_web; сервис Lenkrad называется app, и одинаковый алиас
# раскидал бы трафик lenkrad.ru на оба контейнера.
services:
  doccar:
    build: .
    image: doccar-app:latest
    container_name: doccar-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ADMIN_LOGIN=${ADMIN_LOGIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_SECRET=${ADMIN_SECRET}
    volumes:
      # Персистентные данные: контент, CRM, загруженные фото.
      - ./data:/app/data
    expose:
      - "3000"
    # Потолок памяти — соседний lenkrad-app не должен страдать от этого контейнера.
    mem_limit: 512m
    networks:
      - edge

networks:
  edge:
    external: true
    name: lenkrad_web
